# Builds Flightboard Studio for macOS (arm64, x64) and Windows (x64) on every push and pull request, and makes a GitHub
# release from a semver tag (v1.2.3, v1.2.3-rc.1). See RELEASING.md for the secrets and variables it uses.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if [[ ! "$tag" =~ $re ]]; then
              echo "::error::Tag '$tag' is not a semver release tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease)"
              exit 1
            fi
            version="${tag#v}"
            release=true
            if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          else
            # every other build: the package version as a prerelease, e.g. 1.0.0-ci.42.g1a2b3c4
            version="${base}-ci.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::7}"
            release=false
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "### Flightboard Studio $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
            rid: osx-arm64
            target: --mac --arm64
          # built on Apple silicon too: Electron and the .NET runtime are fetched for x64, nothing runs natively
          - name: mac-x64
            os: macos-15
            rid: osx-x64
            target: --mac --x64
          - name: win-x64
            os: windows-latest
            rid: win-x64
            target: --win --x64
    defaults:
      run:
        shell: bash
        working-directory: flightboard-studio
    steps:
      # keep LF line endings on Windows: the shell scripts and the AltiumSharp patch must stay byte-exact
      - run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@v7
        with:
          path: flightboard-studio

      # the Altium generator lives in its own repository, checked out next to the studio (../pcbgen)
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.PCBGEN_REPOSITORY || format('{0}/pcbgen', github.repository_owner) }}
          ref: ${{ vars.PCBGEN_REF }}
          token: ${{ secrets.PCBGEN_TOKEN || github.token }}
          path: pcbgen

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('pcbgen/gen/*.csproj', 'pcbgen/patches/*.patch', 'pcbgen/tools/altiumsharp.sh') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.rid }}-

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: flightboard-studio/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and bundle
        run: pnpm run build

      - name: Publish the Altium generator (${{ matrix.rid }})
        run: bash scripts/publish-pcbgen.sh ${{ matrix.rid }}

      - name: Package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          # macOS signing and notarization (optional; see RELEASING.md)
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          args=(${{ matrix.target }} --publish never -c.extraMetadata.version="$VERSION" -c.buildVersion="$GITHUB_RUN_NUMBER")
          if [[ "$RUNNER_OS" == macOS ]]; then
            if [[ -n "$MAC_CERT_P12_BASE64" ]]; then
              # electron-builder imports the base64 .p12 into a temporary keychain
              export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
              if [[ -n "$APPLE_API_KEY_P8" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
                printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
                export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
                args+=(-c.mac.notarize=true)
                echo "Signing with the Developer ID certificate and notarizing." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::Signed but not notarized: set APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER"
              fi
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              args+=(-c.mac.identity=-)
              echo "::warning::MAC_CERT_P12_BASE64 is not set: ad-hoc signed macOS build (other Macs will refuse to open it)"
            fi
          fi
          pnpm exec electron-builder "${args[@]}"

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        env:
          SIGNED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          app=$(ls -d dist/mac*/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          # Gatekeeper's verdict (accepted only when signed with Developer ID and notarized)
          if [[ "$SIGNED" == true ]]; then spctl --assess --type execute --verbose "$app" || true; fi

      - uses: actions/upload-artifact@v7
        with:
          name: flightboard-studio-${{ matrix.name }}
          path: |
            flightboard-studio/dist/*.dmg
            flightboard-studio/dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [meta, build]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Flightboard Studio ${{ github.ref_name }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
